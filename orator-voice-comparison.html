<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orator voice comparison</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;padding:16px;max-width:760px;margin:0 auto;background:#1c1618;color:#ece3d2;font:18px/1.55 Georgia,serif}
h1{color:#c9a45c;font-size:1.6rem;margin:0 0 4px}h2{color:#c9a45c;font-size:1.3rem;margin:0 0 8px}
.card{border:1px solid #5a4630;background:#2a1a1f;padding:14px 16px;margin:14px 0}
select,button{font:inherit;color:#ece3d2;border:1px solid #c9a45c;background:#5b1f2b;padding:11px 16px;border-radius:2px;margin:6px 8px 6px 0}
select{width:100%;background:#150f11;border-color:#5a4630}
button:disabled{opacity:.45}.ghost{background:none;border-color:#5a4630}
.sample{font-style:italic;border-left:3px solid #c9a45c;padding-left:12px;color:#d8cdb9}
.st{color:#a3978a;font-size:.95rem;min-height:1.4em}
audio{width:100%;margin-top:8px}details{margin-top:10px;color:#a3978a;font-size:.95rem}summary{color:#c9a45c}
</style>
</head>
<body>
<h1>Voice comparison</h1>
<p class="st" id="dev"></p>
<p>Both engines read the same 100 words. Run one at a time. Everything is generated on this tablet; the text is never uploaded.</p>
<div class="card"><div class="sample" id="txt"></div><div class="st" id="wc"></div></div>
<div id="cards"></div>
<script>
const TEXT="Wisdom begins not with certainty but with wonder. The ancients taught that an unexamined life is hardly worth the living, and yet we hurry past our own questions, mistaking busyness for meaning. Consider the orator in the market square: he does not command belief; he invites reflection. Truth, he says, is a distant harbour, and every argument is a vessel setting out toward it. Some will founder, some will return with a handful of doubts, yet the voyage refines the mind. Let us proceed slowly, weigh each premise, and remember that to understand a thing is to hold it gently.";
const E={
 kokoro:{name:"Kokoro",voices:[["bm_george","George, British male"],["bm_fable","Fable, British male"]],size:"About 92 MB, downloaded once.",lic:"Model: Apache-2.0 (checked on its model card). Trained on public-domain, Apache or MIT audio plus synthetic audio from closed TTS providers; the card asks credit for two CC BY datasets. The phonemizer inside kokoro-js is reported GPL-3.0 (not confirmed)."},
 piper:{name:"Piper",voices:[["en_GB-northern_english_male-medium","Northern English male"],["en_GB-alan-medium","Alan, British male"]],size:"About 63 MB per voice, downloaded once.",lic:"Browser wrapper: MIT. It bundles espeak-ng, which is GPL-3.0. Voice licences are per dataset. Northern English male likely comes from OpenSLR SLR83 (CC BY-SA 4.0), unconfirmed, and may descend from a research-only base. Alan is listed as see-dataset-URL. Neither is confirmed safe for monetised use."}
};
const $=id=>document.getElementById(id);
$("txt").textContent=TEXT;$("wc").textContent=TEXT.split(/\s+/).length+" words";
$("dev").textContent="Memory: "+(navigator.deviceMemory||"unknown")+" GB. CPU cores: "+(navigator.hardwareConcurrency||"unknown")+".";
function wav(f,sr){const n=f.length,b=new ArrayBuffer(44+n*2),d=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)d.setUint8(o+i,s.charCodeAt(i))};w(0,"RIFF");d.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,sr,true);d.setUint32(28,sr*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,"data");d.setUint32(40,n*2,true);for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,f[i]));d.setInt16(44+i*2,s<0?s*32768:s*32767,true)}return new Blob([b],{type:"audio/wav"})}
async function mp3(f,sr){if(!window.lamejs)await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js";s.onload=ok;s.onerror=()=>no(new Error("MP3 encoder did not load"));document.head.appendChild(s)});const e=new lamejs.Mp3Encoder(1,sr,128),q=new Int16Array(f.length),out=[];for(let i=0;i<f.length;i++)q[i]=Math.max(-1,Math.min(1,f[i]))*32767;for(let i=0;i<q.length;i+=1152){const c=e.encodeBuffer(q.subarray(i,i+1152));if(c.length)out.push(c)}const l=e.flush();if(l.length)out.push(l);return new Blob(out,{type:"audio/mpeg"})}
function save(b,name){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click()}
let kk=null,pp=null;
async function runKokoro(v,st){if(!kk){st("Loading engine\u2026");const {KokoroTTS}=await import("https://cdn.jsdelivr.net/npm/kokoro-js@1.2.0/+esm");kk=await KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX",{dtype:"q8",device:"wasm",progress_callback:d=>{if(d.status==="progress")st("Downloading model: "+Math.round(d.progress||0)+"%")}})}
st("Generating\u2026");const t0=performance.now(),r=await kk.generate(TEXT,{voice:v,speed:.95});return{pcm:r.audio,sr:r.sampling_rate,secs:(performance.now()-t0)/1000}}
async function runPiper(v,st){if(!pp)pp=await import("https://cdn.jsdelivr.net/npm/@diffusionstudio/vits-web@1.0.3/+esm");
st("Downloading voice (first time only)\u2026");await pp.download(v,p=>{if(p&&p.total)st("Downloading voice: "+Math.round(p.loaded*100/p.total)+"%")});
st("Generating\u2026");const t0=performance.now(),blob=await pp.predict({text:TEXT,voiceId:v}),secs=(performance.now()-t0)/1000,ac=new(window.AudioContext||window.webkitAudioContext)(),buf=await ac.decodeAudioData(await blob.arrayBuffer());if(ac.close)ac.close();return{pcm:buf.getChannelData(0),sr:buf.sampleRate,secs}}
$("cards").innerHTML=Object.entries(E).map(([k,e])=>`<div class="card" id="c-${k}"><h2>${e.name}</h2><select>${e.voices.map(v=>`<option value="${v[0]}">${v[1]}</option>`).join("")}</select><div class="st">${e.size}</div><button class="go">Generate narration</button><div class="st"></div><audio controls hidden></audio><div hidden><button class="ghost wavb">Download WAV</button><button class="ghost mp3b">Download MP3</button></div><details><summary>Licence notes</summary><p>${e.lic}</p></details></div>`).join("");
for(const k of Object.keys(E)){const c=$("c-"+k),sel=c.querySelector("select"),btn=c.querySelector(".go"),st=c.querySelectorAll(".st")[1],au=c.querySelector("audio"),dl=au.nextElementSibling;let last=null;
 const nm=()=>k+"-"+sel.value;
 btn.onclick=async()=>{btn.disabled=true;try{const r=await(k==="kokoro"?runKokoro:runPiper)(sel.value,t=>st.textContent=t);last=r;const dur=r.pcm.length/r.sr;au.src=URL.createObjectURL(wav(r.pcm,r.sr));au.hidden=false;dl.hidden=false;st.textContent="Audio "+dur.toFixed(1)+" s, generated in "+r.secs.toFixed(1)+" s ("+(dur/r.secs).toFixed(2)+"x real time).";au.play().catch(()=>{})}catch(e){st.textContent="Failed: "+(e.message||e)+". Send this message to Claude."}btn.disabled=false};
 dl.querySelector(".wavb").onclick=()=>last&&save(wav(last.pcm,last.sr),nm()+".wav");
 dl.querySelector(".mp3b").onclick=async()=>{if(!last)return;try{save(await mp3(last.pcm,last.sr),nm()+".mp3")}catch(e){st.textContent=e.message}};
}
</script>
</body>
</html>
